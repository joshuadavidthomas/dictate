name: Set up devenv
description: Install Nix and devenv; the toolchains and tools then come from devenv.nix

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    # The Nix store holds devenv's toolchains and tools; without this each job downloads them again.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: devenv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock', 'rust-toolchain.toml', 'tools/*/rust-toolchain.toml') }}
        restore-prefixes-first-match: devenv-${{ runner.os }}-${{ runner.arch }}-

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: devenv

    - name: Install devenv
      shell: bash
      run: nix profile add nixpkgs#devenv
